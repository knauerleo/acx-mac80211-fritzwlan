# acx-mac80211 for the AVM FRITZ!WLAN USB Stick v1.1 (TNETW1450), Linux 7.2 port.
# Installed by ~/Work/fritzwlan-re/install.sh (copies the source to
# /usr/src/acx-mac80211-$PACKAGE_VERSION, then dkms add/build/install).

PACKAGE_NAME="acx-mac80211"
PACKAGE_VERSION="0.2-port72"
BUILT_MODULE_NAME[0]="acx-mac80211"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KVERSION=${kernelver} KERNELDIR=${kernel_source_dir}"
AUTOINSTALL="yes"
